<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二咖博主检索系统</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #f8f9fa;
  --card: #fff;
  --border: #e5e5e5;
  --text: #1a1a1a;
  --text-dim: #666;
  --text-faint: #999;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
  /* 平台主题色 */
  --douyin: #000000;
  --xhs: #ff2442;
  --kuaishou: #ff6600;
  --bili: #fb7299;
  --weibo: #f4c51c;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 40px 20px;
}
.container { max-width: 1100px; margin: 0 auto; }
.header { text-align:center; margin-bottom: 32px; position: relative; }
.header-logo { position: absolute; right: 0; top: 0; height: 50px; width: auto; }
.header h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
.header p { color: var(--text-dim); font-size: 14px; }

.search-box {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 24px; margin-bottom: 28px;
}
.platform-filter { display:flex; gap: 10px; flex-wrap:wrap; margin-bottom: 18px; }
.platform-tag {
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); cursor:pointer; font-size: 13px; font-weight: 600;
  transition: all .15s; user-select:none; color: var(--text-dim);
}
.platform-tag:hover { border-color: var(--text-dim); transform: scale(1.03); }
.platform-tag.active.douyin { background: #000000 !important; border-color: #000000 !important; color: #fff !important; box-shadow: 0 0 0 3px rgba(0,0,0,0.3) !important; transform: scale(1.05) !important; }
.platform-tag.active.xhs { background: #ff2442 !important; border-color: #ff2442 !important; color: #fff !important; box-shadow: 0 0 0 3px rgba(255,36,66,0.3) !important; transform: scale(1.05) !important; }
.platform-tag.active.kuaishou { background: #ff6600 !important; border-color: #ff6600 !important; color: #fff !important; box-shadow: 0 0 0 3px rgba(255,102,0,0.3) !important; transform: scale(1.05) !important; }
.platform-tag.active.bili { background: #fb7299 !important; border-color: #fb7299 !important; color: #fff !important; box-shadow: 0 0 0 3px rgba(251,114,153,0.3) !important; transform: scale(1.05) !important; }
.platform-tag.active.weibo { background: #f4c51c !important; border-color: #f4c51c !important; color: #1a1a1a !important; box-shadow: 0 0 0 3px rgba(244,197,28,0.3) !important; transform: scale(1.05) !important; }

.search-input {
  width:100%; padding: 14px 18px; border: 1px solid var(--border);
  border-radius: 10px; font-size: 15px; background: var(--bg);
  transition: border-color .15s;
}
.search-input:focus { outline:none; border-color: var(--text-dim); }
.search-input::placeholder { color: var(--text-faint); }
.search-stats { margin-top: 12px; font-size: 13px; color: var(--text-dim); }
.hint { font-size: 12px; color: var(--text-faint); margin-top: 4px; }

.platform-section { margin-bottom: 28px; }
.section-header { display:flex; align-items:center; gap: 10px; margin-bottom: 14px; }
.section-title { font-size: 16px; font-weight: 700; padding: 6px 14px; border-radius: 8px; color: #fff; }
.st-douyin { background: var(--douyin); }
.st-xhs { background: var(--xhs); }
.st-kuaishou { background: var(--kuaishou); }
.st-bili { background: var(--bili); }
.st-weibo { background: var(--weibo); color: #1a1a1a !important; }
.section-count { font-size: 13px; color: var(--text-dim); }

.blogger-card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); margin-bottom: 12px; overflow:hidden;
  transition: transform .15s, box-shadow .15s;
}
.blogger-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
.card-main { padding: 18px 20px; display:flex; align-items:center; gap: 14px; }
.avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display:flex; align-items:center; justify-content:center;
  color: #fff; font-size: 18px; font-weight: 700; flex-shrink:0;
}
.card-info { flex:1; min-width:0; }
.name-line { display:flex; align-items:center; gap: 8px; margin-bottom: 6px; flex-wrap:wrap; }
.blogger-name { font-size: 16px; font-weight: 700; }
.fans-badge { font-size: 12px; color: var(--text-dim); background: var(--bg); padding: 3px 10px; border-radius: 10px; }
.tags { display:flex; gap: 6px; flex-wrap:wrap; margin-bottom: 6px; }
.tag { font-size: 11px; padding: 3px 10px; background: var(--bg); border-radius: 10px; color: var(--text-dim); }
.bio-line { font-size: 12px; color: var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card-actions { display:flex; gap: 8px; flex-shrink:0; }
.btn {
  padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  text-decoration:none; white-space:nowrap; cursor:pointer; border:none;
  transition: opacity .1s; font-family: inherit;
}
.btn:hover { opacity: 0.85; }
.btn-home { color: #fff; border: none; }
.btn-home.douyin { background: var(--douyin); }
.btn-home.xhs { background: var(--xhs); }
.btn-home.kuaishou { background: var(--kuaishou); }
.btn-home.bili { background: var(--bili); }
.btn-home.weibo { background: var(--weibo); color: #1a1a1a; }
.btn-extra.douyin { background: #f5f5f5; color: var(--douyin); border: 1px solid #ddd; }
.btn-extra.xhs { background: #fff0f2; color: var(--xhs); border: 1px solid #ffd0d6; }
.btn-extra.kuaishou { background: #fff5f0; color: var(--kuaishou); border: 1px solid #ffd9c9; }
.btn-extra.bili { background: #fff0f3; color: var(--bili); border: 1px solid #ffd0db; }
.btn-extra.weibo { background: #fffbeb; color: #bfa00d; border: 1px solid #f0e0a0; }
.btn-price { background: var(--bg); color: var(--text-dim); border: 1px solid var(--border); }
.btn-price.active { background: var(--text); color: #fff; }

.price-panel {
  max-height:0; overflow:hidden; transition: max-height .3s ease, padding .3s ease;
  background: var(--bg); border-top: 1px solid var(--border);
}
.price-panel.open { max-height: 400px; padding: 16px 20px; }
.price-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; }
.price-item { background: var(--card); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); }
.price-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
.price-value { font-size: 15px; font-weight: 700; }

.no-results { text-align:center; padding: 50px; color: var(--text-dim); }

.avatar-wrap { position: relative; flex-shrink: 0; }
.avatar-img { width: 48px; height: 48px; object-fit: cover; border-radius: 50%; display: block; }
.avatar-fallback { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #fb7299, #ff2442); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 20px; }
.ip-badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 8px; white-space: nowrap; font-weight: 500; }



/* ========== 手机端竖屏适配（电脑端不变） ========== */
@media (max-width: 640px) {
  body { padding: 12px; }
  .container { max-width: 100%; }
  .header { text-align: left; margin-bottom: 18px; padding-right: 60px; }
  .header h1 { font-size: 19px; line-height: 1.35; margin-bottom: 4px; padding-right: 60px; }
  .header p { font-size: 12px; }
  .header-logo { height: 40px; right: 0; top: -4px; }

  .platform-filter { gap: 6px; margin-bottom: 14px; }
  .platform-tag { padding: 6px 12px; font-size: 12px; border-radius: 16px; }

  .search-input { padding: 12px 14px; font-size: 14px; }

  /* 卡片：横向 — 头像在左，姓名/粉丝/简介 在头像右侧，按钮换到下一行 */
  .card-main {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 12px;
    padding: 14px;
  }
  .avatar-wrap { flex-shrink: 0; }
  .avatar-img, .avatar-fallback { width: 56px; height: 56px; }
  .avatar-fallback { font-size: 22px; }
  .ip-badge { font-size: 9px; padding: 1px 5px; }

  /* 中间信息栏：头像右侧，占满中间空间 */
  .card-info {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .name-line {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px;
    align-items: baseline;
    margin-bottom: 0;
  }
  .blogger-name {
    font-size: 16px;
    font-weight: 700;
    word-break: keep-all;
    overflow-wrap: anywhere;
    white-space: normal;
    max-width: 100%;
    flex: 0 1 auto;
  }
  .fans-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    flex: 0 1 auto;
    max-width: 100%;
    white-space: normal;
    word-break: keep-all;
  }

  .tags { gap: 5px; margin-bottom: 0; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 8px;
    word-break: keep-all;
  }

  .bio-line {
    font-size: 12px;
    line-height: 1.45;
    white-space: normal;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    max-width: 100%;
    word-break: break-word;
    margin-top: 0;
  }

  /* 按钮行：强制换到下一行，占满宽度 */
  .card-actions {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px;
    flex-basis: 100%;
    margin-top: 2px;
  }
  .btn {
    padding: 7px 12px;
    font-size: 12px;
    flex: 1 1 auto;
    text-align: center;
    min-width: 70px;
    white-space: nowrap;
  }

  /* 价格面板 */
  .price-panel.open { padding: 12px 14px; }
  .price-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .price-item { padding: 10px 12px; }
  .price-label { font-size: 10px; }
  .price-value { font-size: 14px; }

  .section-header { margin-bottom: 10px; }
  .section-title { padding: 5px 10px; font-size: 13px; }
  .section-count { font-size: 12px; }
}

@media (max-width: 380px) {
  .blogger-name { font-size: 15px; }
  .fans-badge { font-size: 10px; padding: 2px 6px; }
  .btn { font-size: 11px; padding: 6px 10px; min-width: 60px; }
  .price-grid { grid-template-columns: 1fr; }
}
.fans-badge { font-size: 10px; padding: 2px 6px; }
  .btn { font-size: 11px; padding: 6px 10px; min-width: 60px; }
  .price-grid { grid-template-columns: 1fr; }
}
</style>
</head>

let selectedPlatforms = [];

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function formatFans(f) {
  if (!f || f === '/' || f === '0' || f === 0) return '-';
  const raw = String(f);
  // 注：源数据中"千"实际指"千万"
  if (raw.includes('千')) {
    const num = parseFloat(raw);
    if (isNaN(num)) return raw;
    return num.toFixed(1) + '千万粉丝';
  }
  const num = parseFloat(raw);
  if (isNaN(num)) return raw;
  return num.toFixed(1) + '万粉丝';
}



function render() {
  const box = document.getElementById("results");
  const stats = document.getElementById("searchStats");

  if(!hasSearched && selectedPlatforms.length === 0) {
    stats.textContent = "";
    box.innerHTML = ``;
    return;
  }
  if(selectedPlatforms.length > 0) hasSearched = true;

  const q = searchQuery.toLowerCase();
  function matchBlogger(b){
    if(!q) return true;
    const mName = b.name.toLowerCase().includes(q);
    const mTags = b.tags.some(t => t.toLowerCase().includes(q));
    const mBio = b.bio.toLowerCase().includes(q);
    const city = (b.city || "").toLowerCase();
    const mCity = city.includes(q);
    // 国家搜索：查询国家名时，匹配该国家下所有城市
    let mCountry = false;
    if (countryCities[q]) {
      mCountry = countryCities[q].some(cc => city.includes(cc.toLowerCase()));
    }
    return mName || mTags || mBio || mCity || mCountry;
  }

  const showAll = selectedPlatforms.length === 0;
  let totalCards = 0;
  let html = "";

  platformOrder.forEach(plat => {
    if(!showAll && !selectedPlatforms.includes(plat)) return;
    const list = bloggers.filter(b => b.platforms[plat] && matchBlogger(b));
    if(list.length === 0) return;
    totalCards += list.length;
    html += `<div class="platform-section">
      <div class="section-header">
        <span class="section-title st-${plat}">${platformNames[plat]}</span>
        <span class="section-count">${list.length} 位</span>
      </div>`;
    list.forEach(b => {
      const p = b.platforms[plat];
      const tags = b.tags.slice(0,4).map(t => `<span class="tag">${esc(t)}</span>`).join("");
      const extraBtn = p.extra
        ? `<a class="btn btn-extra ${plat}" href="${esc(p.extra)}" target="_blank" rel="noopener">${esc(p.extraName)}↗</a>`

      const priceKey = `${b.name}|${plat}`;
      const isOpen = openPrices.has(priceKey);
      const priceBtnClass = isOpen ? "btn btn-price active" : "btn btn-price";
      const priceBtnText = isOpen ? "收起报价↑" : "显示报价↓";
      let pricePanelHtml = "";
      if(p.prices) {
        const priceItems = Object.entries(p.prices).map(([k,v]) => `
          <div class="price-item">
            <div class="price-label">${esc(k)}</div>
            <div class="price-value">${esc(v)}</div>
          </div>
        `).join("");
        pricePanelHtml = `<div class="price-grid">${priceItems}</div>`;
      }
      html += `<div class="blogger-card" data-key="${esc(priceKey)}">
        <div class="card-main">
          <div class="avatar-wrap">
            ${b.avatar ? `<img class="avatar-img" src="${b.avatar}" alt="${esc(b.name)}">` : `<div class="avatar-fallback">${esc(b.name.charAt(0))}</div>`}
            ${b.city ? `<div class="ip-badge">IP:${esc(b.city)}</div>` : ''}
          </div>
          <div class="card-info">
            <div class="name-line">
              <span class="blogger-name">${esc(b.name)}</span>
              <span class="fans-badge">${platformNames[plat]} ${esc(formatFans(p.fans))}</span>
            </div>
            <div class="tags">${tags}</div>
            <div class="bio-line">${esc(b.bio)}</div>
          </div>
          <div class="card-actions">
            <a class="btn btn-home ${plat}" href="${esc(p.home)}" target="_blank" rel="noopener">主页↗</a>
            ${extraBtn}
            <button class="${priceBtnClass}" onclick="togglePrice('${esc(priceKey)}')">${priceBtnText}</button>
          </div>
        </div>
        <div class="price-panel ${isOpen ? 'open' : ''}" id="panel-${esc(priceKey).replace(/[^a-zA-Z0-9]/g,'-')}">
          ${pricePanelHtml}
        </div>
      </div>`;
    });
    html += `</div>`;
  });

  stats.textContent = "共 " + totalCards + " 条结果";
  if(totalCards === 0){
    box.innerHTML = `<div class="no-results"><p>未找到匹配的博主</p></div>`;
  } else {
    box.innerHTML = html;
  }
}

window.togglePrice = function(key) {
  if(openPrices.has(key)) openPrices.delete(key);
  else openPrices.add(key);
  render();
};

document.querySelectorAll(".platform-tag").forEach(tag => {
  tag.addEventListener("click", (e) => {
    const p = tag.dataset.platform;
    const isActive = selectedPlatforms.includes(p);
    if(isActive){
      selectedPlatforms = selectedPlatforms.filter(x => x !== p);
      tag.classList.remove("active");
      tag.style.background = "";
      tag.style.borderColor = "";
      tag.style.color = "";
      tag.style.boxShadow = "";
      tag.style.transform = "";
    } else {
      selectedPlatforms.push(p);
      tag.classList.add("active");
      const colors = {"douyin":"#000000","xhs":"#ff2442","kuaishou":"#ff6600","bili":"#fb7299","weibo":"#f4c51c"};
      const color = colors[p];
      tag.style.background = color;
      tag.style.borderColor = color;
      tag.style.color = p === 'weibo' ? '#1a1a1a' : '#fff';
      tag.style.boxShadow = `0 0 0 3px ${color}44`;
      tag.style.transform = 'scale(1.05)';
    }
    render();
  });
});

document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value.trim();
  hasSearched = searchQuery.length > 0 || selectedPlatforms.length > 0;
  render();
});

render();
</script>
</body>
</html>
